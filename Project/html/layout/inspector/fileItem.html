				<!-- 文件 - 物品 -->
				<page-frame value="fileItem">
					<detail-box open>
						<detail-summary>General</detail-summary>
						<detail-grid id="fileItem-general-grid">
							<text>Icon</text
							><custom-box id="fileItem-icon" type="file" filter="image"></custom-box>
							<text>Clip</text
							><custom-box
								id="fileItem-clip"
								type="clip"
								image="fileItem-icon"
							></custom-box>
							<text>Inherit</text
							><custom-box
								id="fileItem-inherit"
								type="file"
								filter="item"
							></custom-box>
						</detail-grid>
					</detail-box>
					<detail-box open>
						<detail-summary>Attributes</detail-summary>
						<param-list
							id="fileItem-attributes"
							class="inspector-list"
							group="item"
							flexible
						></param-list>
					</detail-box>
					<detail-box open>
						<detail-summary>Events</detail-summary>
						<param-list
							id="fileItem-events"
							class="inspector-list"
							filter="item"
							flexible
						></param-list>
					</detail-box>
					<detail-box open>
						<detail-summary>Scripts</detail-summary>
						<param-list
							id="fileItem-scripts"
							class="inspector-list"
							flexible
						></param-list>
					</detail-box>
					<parameter-pane id="fileItem-parameter-pane"></parameter-pane>
				</page-frame>
