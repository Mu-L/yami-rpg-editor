				<!-- 文件 - 状态 -->
				<page-frame value="fileState">
					<detail-box open>
						<detail-summary>General</detail-summary>
						<detail-grid id="fileState-general-grid">
							<text>Icon</text
							><custom-box
								id="fileState-icon"
								type="file"
								filter="image"
							></custom-box>
							<text>Clip</text
							><custom-box
								id="fileState-clip"
								type="clip"
								image="fileState-icon"
							></custom-box>
							<text>Inherit</text
							><custom-box
								id="fileState-inherit"
								type="file"
								filter="state"
							></custom-box>
						</detail-grid>
					</detail-box>
					<detail-box open>
						<detail-summary>Attributes</detail-summary>
						<param-list
							id="fileState-attributes"
							class="inspector-list"
							group="state"
							flexible
						></param-list>
					</detail-box>
					<detail-box open>
						<detail-summary>Events</detail-summary>
						<param-list
							id="fileState-events"
							class="inspector-list"
							filter="state"
							flexible
						></param-list>
					</detail-box>
					<detail-box open>
						<detail-summary>Scripts</detail-summary>
						<param-list
							id="fileState-scripts"
							class="inspector-list"
							flexible
						></param-list>
					</detail-box>
					<parameter-pane id="fileState-parameter-pane"></parameter-pane>
				</page-frame>
