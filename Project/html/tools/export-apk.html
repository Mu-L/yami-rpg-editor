<!-- export_apk 窗口 -->
<window-frame id="export-apk">
	<title-bar>构建APK<close></close></title-bar>
	<content-frame>
		<box id="export-apk-out">
			<grid-box id="export-apk-grid">
				<text class="project-summary">应用配置</text>
				<text>应用名称</text><text-box id="export-apk-apkName"></text-box>
				<text>应用图标</text><text-box id="export-apk-apkIcon"></text-box>
				<text>应用包名</text><text-box id="export-apk-apkPackageName"></text-box>
				<text>应用版本</text><text-box id="export-apk-apkVersionName"></text-box>
				<text>应用版本号</text><text-box id="export-apk-apkVersionCode"></text-box>
			</grid-box>
			<box id="export-apk-PS">
				<text class="project-summary export-apk-major">PS（温馨提示）</text>
				<text class="export-apk-major"
					>构建前请确保您安装了Java，apktool（内置）、apksigner（内置）、zipalign（内置）工具</text
				>
				<text class="export-apk-major"
					>构建前请确保您的项目路径不包含中文、且.preview文件夹存在(ctrl+s保存可快速创建)</text
				>
				<text class="export-apk-major"
					>模板包无内置Taptap和生命周期，因此（移动端-API.指令）插件的部分功能无法使用，如需使用请自行构建<text
						class="href"
						href="https://github.com/Open-Yami-Community/yamiexample"
						>示例项目</text
					></text
				>
				<text class="export-apk-major"
					>@表示编辑器模板目录、$表示项目目录apk文件夹、~表示项目目录</text
				>
			</box>
			<box id="export-apk-container">
				<box id="export-apk-content"> </box>
			</box>
		</box>
		<button id="export-apk-button" name="export-to-apk"></button>
	</content-frame>
</window-frame>
