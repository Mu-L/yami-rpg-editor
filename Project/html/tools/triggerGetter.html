<!-- 触发器访问器窗口 -->
<window-frame id="triggerGetter">
	<title-bar>Trigger<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="triggerGetter-type"></select-box> <text>Variable</text
			><custom-box id="triggerGetter-variable" type="variable" filter="object"></custom-box>
		</grid-box>
		<button id="triggerGetter-confirm" name="confirm">Confirm</button>
		<button id="triggerGetter-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
