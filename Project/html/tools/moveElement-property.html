<!-- 移动元素 - 属性 -->
<window-frame id="moveElement-property">
	<title-bar>Transform Property<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Property</text><select-box id="moveElement-property-key"></select-box>
			<text>Anchor X</text
			><number-var
				id="moveElement-property-anchorX"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Anchor Y</text
			><number-var
				id="moveElement-property-anchorY"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
			></number-var>
			<text>X</text
			><number-var
				id="moveElement-property-x"
				min="-10000"
				max="10000"
				decimals="4"
				unit="px"
			></number-var>
			<text>Y</text
			><number-var
				id="moveElement-property-y"
				min="-10000"
				max="10000"
				decimals="4"
				unit="px"
			></number-var>
			<text>Width</text
			><number-var
				id="moveElement-property-width"
				min="-10000"
				max="10000"
				decimals="4"
				unit="px"
			></number-var>
			<text>Height</text
			><number-var
				id="moveElement-property-height"
				min="-10000"
				max="10000"
				decimals="4"
				unit="px"
			></number-var>
			<text>X2</text
			><number-var
				id="moveElement-property-x2"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
				unit="r"
			></number-var>
			<text>Y2</text
			><number-var
				id="moveElement-property-y2"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
				unit="r"
			></number-var>
			<text>Width2</text
			><number-var
				id="moveElement-property-width2"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
				unit="r"
			></number-var>
			<text>Height2</text
			><number-var
				id="moveElement-property-height2"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
				unit="r"
			></number-var>
			<text>Rotation</text
			><number-var
				id="moveElement-property-rotation"
				min="-36000"
				max="36000"
				decimals="4"
				unit="deg"
			></number-var>
			<text>Scale X</text
			><number-var
				id="moveElement-property-scaleX"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Scale Y</text
			><number-var
				id="moveElement-property-scaleY"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Skew X</text
			><number-var
				id="moveElement-property-skewX"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Skew Y</text
			><number-var
				id="moveElement-property-skewY"
				min="-100"
				max="100"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Opacity</text
			><number-var
				id="moveElement-property-opacity"
				min="0"
				max="1"
				step="0.05"
				decimals="4"
			></number-var>
		</grid-box>
		<button id="moveElement-property-confirm" name="confirm">Confirm</button>
		<button id="moveElement-property-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
