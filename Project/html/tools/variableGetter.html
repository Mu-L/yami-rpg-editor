<!-- 变量访问器窗口 -->
<window-frame id="variableGetter">
	<title-bar>Variable<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="variableGetter-type"></select-box> <text>Actor</text
			><custom-box id="variableGetter-actor" type="actor"></custom-box> <text>Skill</text
			><custom-box id="variableGetter-skill" type="skill"></custom-box> <text>State</text
			><custom-box id="variableGetter-state" type="state"></custom-box> <text>Equipment</text
			><custom-box id="variableGetter-equipment" type="equipment"></custom-box>
			<text>Item</text><custom-box id="variableGetter-item" type="item"></custom-box>
			<text>Element</text><custom-box id="variableGetter-element" type="element"></custom-box>
			<text>Key</text><text-box id="variableGetter-common-key"></text-box> <text>Key</text
			><select-var id="variableGetter-preset-key"></select-var> <text>Key</text
			><custom-box id="variableGetter-global-key" type="global-variable"></custom-box>
		</grid-box>
		<button id="variableGetter-confirm" name="confirm">Confirm</button>
		<button id="variableGetter-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
