<!-- 自动图块 - 生成动画帧窗口 -->
<window-frame id="autoTile-generateFrames">
	<title-bar>Generate Frames<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Stride X</text
			><number-box id="autoTile-generateFrames-strideX" min="-128" max="128"></number-box>
			<text>Stride Y</text
			><number-box id="autoTile-generateFrames-strideY" min="-128" max="128"></number-box>
			<text>Count</text
			><number-box id="autoTile-generateFrames-count" min="1" max="255"></number-box>
		</grid-box>
		<button id="autoTile-generateFrames-confirm" name="confirm">Confirm</button>
		<button id="autoTile-generateFrames-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
