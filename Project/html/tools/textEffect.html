<!-- 设置文字效果 -->
<window-frame id="textEffect">
	<title-bar>Set Text Effect<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Effect</text><select-box id="textEffect-type"></select-box> <text>Shadow X</text
			><number-box id="textEffect-shadowOffsetX" min="-9" max="9" unit="px"></number-box>
			<text>Shadow Y</text
			><number-box id="textEffect-shadowOffsetY" min="-9" max="9" unit="px"></number-box>
			<text>Stroke Width</text
			><number-box id="textEffect-strokeWidth" min="1" max="20" unit="px"></number-box>
			<text>Effect Color</text><color-box id="textEffect-color"></color-box>
		</grid-box>
		<button id="textEffect-confirm" name="confirm">Confirm</button>
		<button id="textEffect-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
