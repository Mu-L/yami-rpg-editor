<!-- 过渡窗口 -->
<window-frame id="easing">
	<title-bar>Easing<close></close></title-bar>
	<content-frame>
		<field-set id="easing-list-fieldset" class="input pad">
			<legend>List</legend>
			<node-list id="easing-list" padded></node-list>
		</field-set>
		<field-set id="easing-points-fieldset">
			<legend>Points</legend>
			<grid-box id="easing-points-grid">
				<text>Mode</text><select-box id="easing-mode"></select-box>
				<text id="easing-points-0">Point 1</text>
				<number-box id="easing-points-0-x" min="0" max="1" step="0.01" decimals="2"
					><text class="label">X</text></number-box
				>
				<number-box id="easing-points-0-y" min="-5" max="5" step="0.01" decimals="2"
					><text class="label">Y</text></number-box
				>
				<text id="easing-points-1">Point 2</text>
				<number-box id="easing-points-1-x" min="0" max="1" step="0.01" decimals="2"
					><text class="label">X</text></number-box
				>
				<number-box id="easing-points-1-y" min="-5" max="5" step="0.01" decimals="2"
					><text class="label">Y</text></number-box
				>
				<text id="easing-points-2">Point 3</text>
				<number-box id="easing-points-2-x" min="0" max="1" step="0.01" decimals="2"
					><text class="label">X</text></number-box
				>
				<number-box id="easing-points-2-y" min="-5" max="5" step="0.01" decimals="2"
					><text class="label">Y</text></number-box
				>
				<text id="easing-points-3">Point 4</text>
				<number-box id="easing-points-3-x" min="0" max="1" step="0.01" decimals="2"
					><text class="label">X</text></number-box
				>
				<number-box id="easing-points-3-y" min="-5" max="5" step="0.01" decimals="2"
					><text class="label">Y</text></number-box
				>
				<text id="easing-points-4">Point 5</text>
				<number-box id="easing-points-4-x" min="0" max="1" step="0.01" decimals="2"
					><text class="label">X</text></number-box
				>
				<number-box id="easing-points-4-y" min="-5" max="5" step="0.01" decimals="2"
					><text class="label">Y</text></number-box
				>
				<text id="easing-points-5">Point 6</text>
				<number-box id="easing-points-5-x" min="0" max="1" step="0.01" decimals="2"
					><text class="label">X</text></number-box
				>
				<number-box id="easing-points-5-y" min="-5" max="5" step="0.01" decimals="2"
					><text class="label">Y</text></number-box
				>
				<text id="easing-points-6">Point 7</text>
				<number-box id="easing-points-6-x" min="0" max="1" step="0.01" decimals="2"
					><text class="label">X</text></number-box
				>
				<number-box id="easing-points-6-y" min="-5" max="5" step="0.01" decimals="2"
					><text class="label">Y</text></number-box
				>
				<text id="easing-points-7">Point 8</text>
				<number-box id="easing-points-7-x" min="0" max="1" step="0.01" decimals="2"
					><text class="label">X</text></number-box
				>
				<number-box id="easing-points-7-y" min="-5" max="5" step="0.01" decimals="2"
					><text class="label">Y</text></number-box
				>
			</grid-box>
		</field-set>
		<field-set id="easing-curve-fieldset">
			<legend>Curve</legend>
			<canvas id="easing-curve-canvas" width="0" height="0" tabindex="-1"></canvas>
			<radio-box name="easing-scale" value="1">100%</radio-box>
			<radio-box name="easing-scale" value="0.5">50%</radio-box>
		</field-set>
		<field-set id="easing-preview-fieldset">
			<legend>Preview</legend>
			<canvas id="easing-preview-canvas" width="0" height="0"></canvas>
			<grid-box id="easing-preview-grid">
				<text>Reverse</text><select-box id="easing-preview-reverse"></select-box>
				<text>Duration</text
				><number-box
					id="easing-preview-duration"
					min="1"
					max="60000"
					unit="ms"
				></number-box>
				<text>Wait</text
				><number-box id="easing-preview-delay" min="0" max="5000" unit="ms"></number-box>
			</grid-box>
		</field-set>
		<button id="easing-confirm" name="confirm">Confirm</button>
		<button id="easing-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
