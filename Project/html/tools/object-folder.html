<!-- 默认对象文件夹 -->
<window-frame id="object-folder">
	<title-bar>Default Object Folders<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Tilemap</text><text-box id="object-folder-tilemap"></text-box> <text>Actor</text
			><text-box id="object-folder-actor"></text-box> <text>Region</text
			><text-box id="object-folder-region"></text-box> <text>Light</text
			><text-box id="object-folder-light"></text-box> <text>Animation</text
			><text-box id="object-folder-animation"></text-box> <text>Particle</text
			><text-box id="object-folder-particle"></text-box> <text>Parallax</text
			><text-box id="object-folder-parallax"></text-box>
		</grid-box>
		<button id="object-folder-confirm" name="confirm">Confirm</button>
		<button id="object-folder-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
