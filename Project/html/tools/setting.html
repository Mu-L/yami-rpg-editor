<!-- Open设置窗口 -->
<window-frame id="setting">
	<title-bar id="setting-title"
		>Setting<maximize></maximize>
		<close></close>
	</title-bar>
	<content-frame>
		<grid-box id="setting-grid">
			<text id="setting-title-server" class="setting-title">Server</text>
			<text></text><number-box id="setting-server-port" min="0" max="65535"></number-box>
			<text></text><check-box id="setting-server-auto" class="standard"></check-box>
			<text id="setting-title-apkbuild" class="setting-title">APK Build</text>
			<text></text><text-box id="setting-apkbuild-outputDir"></text-box> <text></text
			><text-box id="setting-apkbuild-newApkPath"></text-box> <text></text
			><text-box id="setting-apkbuild-apktoolPath"></text-box>
			<text id="setting-title-signed" class="setting-title">签名配置</text>
			<text></text><text-box id="setting-signed-jksPath"></text-box> <text></text
			><text-box id="setting-signed-keyStorePassword"></text-box> <text></text
			><text-box id="setting-signed-keyAlias"></text-box> <text></text
			><text-box id="setting-signed-keyPassword"></text-box> <text></text
			><text-box id="setting-signed-apksignerPath"></text-box> <text></text
			><text-box id="setting-signed-zipalignPath"></text-box> <text></text
			><text-box id="setting-signed-signedApkPath"></text-box>
			<text id="setting-title-other" class="setting-title">other</text>
			<text></text
			><check-box id="setting-other-copyAsTextKeepEmptyLine" class="standard"></check-box>
			<text></text><select-box id="setting-other-browserSearchHistoryLimit"></select-box>
			<text id="setting-title-recent" class="setting-title"></text>
			<text id="setting-recent-statsMode-label"></text
			><select-box id="setting-recent-statsMode"></select-box>
			<text id="setting-title-github" class="setting-title">GitHub</text>
			<text></text><select-box id="setting-github-accelerationNode"></select-box>
			<text id="setting-title-update" class="setting-title"></text>
			<text id="setting-update-checkOnStart-label"></text
			><check-box id="setting-update-checkOnStart" class="standard"></check-box>
		</grid-box>
		<button id="setting-confirm" name="confirm">Confirm</button>
		<button id="setting-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
