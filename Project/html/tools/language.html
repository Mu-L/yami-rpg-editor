<!-- 语言窗口 -->
<window-frame id="language">
	<title-bar>Language<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Name</text><select-box id="language-name"></select-box> <text>Font</text
			><custom-box id="language-font" type="file" filter="font"></custom-box>
			<text>Font Size Scaling</text
			><number-box id="language-scale" min="0.5" max="2" decimals="10"></number-box>
		</grid-box>
		<button id="language-confirm" name="confirm">Confirm</button>
		<button id="language-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
