<!-- 设置文字位置 -->
<window-frame id="textPosition">
	<title-bar>Set Text Position<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Axis</text><select-box id="textPosition-axis"></select-box> <text>Operation</text
			><select-box id="textPosition-operation"></select-box> <text>Value</text
			><number-box id="textPosition-value" min="-1000" max="1000" unit="px"></number-box>
		</grid-box>
		<button id="textPosition-confirm" name="confirm">Confirm</button>
		<button id="textPosition-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
