<!-- 场景对象访问器窗口 -->
<window-frame id="objectGetter">
	<title-bar>Scene Object<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="objectGetter-type"></select-box> <text>Object</text
			><custom-box id="objectGetter-presetId" type="preset-object" filter="any"></custom-box>
			<text>Variable</text
			><custom-box id="objectGetter-variable" type="variable" filter="object"></custom-box>
		</grid-box>
		<button id="objectGetter-confirm" name="confirm">Confirm</button>
		<button id="objectGetter-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
