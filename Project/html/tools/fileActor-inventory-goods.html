<!-- 角色库存窗口 -->
<window-frame id="fileActor-inventory-goods">
	<title-bar>Inventory<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="fileActor-inventory-type"></select-box>
			<text>Item</text
			><custom-box id="fileActor-inventory-item-id" type="file" filter="item"></custom-box>
			<text>Quantity</text
			><number-box id="fileActor-inventory-item-quantity" min="1" max="10000"></number-box>
			<text>Equipment</text
			><custom-box
				id="fileActor-inventory-equipment-id"
				type="file"
				filter="equipment"
			></custom-box>
			<text>Money</text
			><number-box id="fileActor-inventory-money" min="1" max="100000000"></number-box>
		</grid-box>
		<button id="fileActor-inventory-confirm" name="confirm">Confirm</button>
		<button id="fileActor-inventory-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
