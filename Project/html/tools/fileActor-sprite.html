<!-- 动画精灵图窗口 -->
<window-frame id="fileActor-sprite">
	<title-bar>Sprite<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Name</text><select-box id="fileActor-sprite-id"></select-box> <text>Image</text
			><custom-box id="fileActor-sprite-image" type="file" filter="image"></custom-box>
		</grid-box>
		<button id="fileActor-sprite-confirm" name="confirm">Confirm</button>
		<button id="fileActor-sprite-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
