<!-- 动画精灵图窗口 -->
<window-frame id="fileAnimation-sprite">
	<title-bar>Sprite<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Name</text><text-box id="fileAnimation-sprite-name"></text-box> <text>Image</text
			><custom-box id="fileAnimation-sprite-image" type="file" filter="image"></custom-box>
			<text>Horiz Frames</text
			><number-box id="fileAnimation-sprite-hframes" min="1" max="256"></number-box>
			<text>Vert Frames</text
			><number-box id="fileAnimation-sprite-vframes" min="1" max="256"></number-box>
		</grid-box>
		<button id="fileAnimation-sprite-confirm" name="confirm">Confirm</button>
		<button id="fileAnimation-sprite-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
