<!-- 祖先元素访问器窗口 -->
<window-frame id="ancestorGetter">
	<title-bar>Element<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="ancestorGetter-type"></select-box> <text>Data ID</text
			><custom-box id="ancestorGetter-presetId" type="preset-element"></custom-box>
			<text>Variable</text
			><custom-box id="ancestorGetter-variable" type="variable" filter="object"></custom-box>
		</grid-box>
		<button id="ancestorGetter-confirm" name="confirm">Confirm</button>
		<button id="ancestorGetter-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
