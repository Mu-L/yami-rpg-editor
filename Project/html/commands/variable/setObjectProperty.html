<window-frame id="setObjectProperty">
	<title-bar>setObjectProperty<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Variable</text
			><custom-box
				id="setObjectProperty-variable"
				type="variable"
				filter="object"
			></custom-box>
			<text>setObjectProperty</text><param-list id="setObjectProperty-list"></param-list>
			<text>valueVariable</text
			><custom-box
				id="setObjectProperty-value-variable"
				type="variable"
				filter="all"
			></custom-box>
		</grid-box>
		<button id="setObjectProperty-confirm" name="confirm">Confirm</button>
		<button id="setObjectProperty-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
