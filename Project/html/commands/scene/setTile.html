<window-frame id="setTile">
	<title-bar>Set Tile<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Tilemap</text><custom-box id="setTile-tilemap" type="tilemap"></custom-box>
			<text>Tilemap X</text><number-var id="setTile-tilemapX" min="0" max="511"></number-var>
			<text>Tilemap Y</text><number-var id="setTile-tilemapY" min="0" max="511"></number-var>
			<text>Tileset</text
			><custom-box id="setTile-tilesetId" type="file" filter="tileset"></custom-box>
			<text>Tileset X</text><number-var id="setTile-tilesetX" min="0" max="255"></number-var>
			<text>Tileset Y</text><number-var id="setTile-tilesetY" min="0" max="255"></number-var>
		</grid-box>
		<button id="setTile-confirm" name="confirm">Confirm</button>
		<button id="setTile-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
