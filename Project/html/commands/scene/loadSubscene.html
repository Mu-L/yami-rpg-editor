<window-frame id="loadSubscene">
	<title-bar>Load Subscene<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Scene</text
			><file-var id="loadSubscene-sceneId" type="file" filter="scene"></file-var>
			<text>Shift X</text><number-var id="loadSubscene-shiftX" min="0" max="512"></number-var>
			<text>Shift Y</text><number-var id="loadSubscene-shiftY" min="0" max="512"></number-var>
		</grid-box>
		<button id="loadSubscene-confirm" name="confirm">Confirm</button>
		<button id="loadSubscene-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
