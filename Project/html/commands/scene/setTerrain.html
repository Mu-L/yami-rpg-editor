<window-frame id="setTerrain">
	<title-bar>Set Terrain<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Position</text><custom-box id="setTerrain-position" type="position"></custom-box>
			<text>Terrain</text><select-box id="setTerrain-terrain"></select-box>
		</grid-box>
		<button id="setTerrain-confirm" name="confirm">Confirm</button>
		<button id="setTerrain-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
