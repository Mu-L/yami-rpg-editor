<window-frame id="deleteTile">
	<title-bar>Delete Tile<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Tilemap</text><custom-box id="deleteTile-tilemap" type="tilemap"></custom-box>
			<text>Tilemap X</text
			><number-var id="deleteTile-tilemapX" min="0" max="511"></number-var>
			<text>Tilemap Y</text
			><number-var id="deleteTile-tilemapY" min="0" max="511"></number-var>
		</grid-box>
		<button id="deleteTile-confirm" name="confirm">Confirm</button>
		<button id="deleteTile-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
