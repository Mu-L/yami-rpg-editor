<window-frame id="callEvent">
	<title-bar>Call Event<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="callEvent-type"></select-box> <text>Actor</text
			><custom-box id="callEvent-actor" type="actor"></custom-box> <text>Skill</text
			><custom-box id="callEvent-skill" type="skill"></custom-box> <text>State</text
			><custom-box id="callEvent-state" type="state"></custom-box> <text>Equipment</text
			><custom-box id="callEvent-equipment" type="equipment"></custom-box> <text>Item</text
			><custom-box id="callEvent-item" type="item"></custom-box> <text>Light</text
			><custom-box id="callEvent-light" type="light"></custom-box> <text>Element</text
			><custom-box id="callEvent-element" type="element"></custom-box> <text>Event</text
			><custom-box id="callEvent-eventId" type="file" filter="event"></custom-box>
			<text>Event</text><select-box id="callEvent-eventType"></select-box>
		</grid-box>
		<button id="callEvent-confirm" name="confirm">Confirm</button>
		<button id="callEvent-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
