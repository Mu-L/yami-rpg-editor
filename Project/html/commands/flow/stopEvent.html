<window-frame id="stopEvent">
	<title-bar>Stop Event<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="stopEvent-type"></select-box> <text>Actor</text
			><custom-box id="stopEvent-actor" type="actor"></custom-box> <text>Skill</text
			><custom-box id="stopEvent-skill" type="skill"></custom-box> <text>State</text
			><custom-box id="stopEvent-state" type="state"></custom-box> <text>Equipment</text
			><custom-box id="stopEvent-equipment" type="equipment"></custom-box> <text>Item</text
			><custom-box id="stopEvent-item" type="item"></custom-box> <text>Light</text
			><custom-box id="stopEvent-light" type="light"></custom-box> <text>Element</text
			><custom-box id="stopEvent-element" type="element"></custom-box> <text>Event</text
			><custom-box id="stopEvent-eventId" type="file" filter="event"></custom-box>
			<text>Event</text><select-box id="stopEvent-eventType"></select-box>
		</grid-box>
		<button id="stopEvent-confirm" name="confirm">Confirm</button>
		<button id="stopEvent-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
