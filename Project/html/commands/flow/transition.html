<window-frame id="transition">
	<title-bar>Transition<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Write to Variable</text
			><custom-box id="transition-variable" type="variable" filter="number"></custom-box>
			<text>Start Value</text
			><number-var
				id="transition-start"
				min="-1000000000"
				max="1000000000"
				decimals="10"
			></number-var>
			<text>End Value</text
			><number-var
				id="transition-end"
				min="-1000000000"
				max="1000000000"
				decimals="10"
			></number-var>
			<text>Easing</text><select-box id="transition-easingId" name="easing"></select-box>
			<text>Duration</text
			><number-var
				id="transition-duration"
				name="duration"
				min="0"
				max="3600000"
				unit="ms"
			></number-var>
		</grid-box>
		<button id="transition-confirm" name="confirm">Confirm</button>
		<button id="transition-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
