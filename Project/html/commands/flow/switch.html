<window-frame id="switch">
	<title-bar>Switch<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Variable</text
			><custom-box id="switch-variable" type="variable" filter="all"></custom-box>
			<text>Branches</text><param-list id="switch-branches"></param-list>
		</grid-box>
		<check-box id="switch-default" class="standard"
			><text id="switch-default-label">Default</text></check-box
		>
		<button id="switch-confirm" name="confirm">Confirm</button>
		<button id="switch-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
