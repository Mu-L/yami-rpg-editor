<window-frame id="forEach">
	<title-bar>For Each<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Data</text><select-box id="forEach-data"></select-box> <text>List Variable</text
			><custom-box id="forEach-list" type="variable" filter="object"></custom-box>
			<text>Actor</text><custom-box id="forEach-actor" type="actor"></custom-box>
			<text>Parent Element</text><custom-box id="forEach-element" type="element"></custom-box>
			<text>Attribute Group</text
			><custom-box id="forEach-attribute-groupId" type="attribute-group"></custom-box>
			<text>Enum Group</text
			><custom-box id="forEach-enum-groupId" type="enum-group"></custom-box>
			<text>Write to Variable</text
			><custom-box id="forEach-variable" type="variable" filter="object"></custom-box>
			<text>Write Save Index</text
			><custom-box id="forEach-saveIndex" type="variable" filter="number"></custom-box>
			<text>Touch Id</text
			><custom-box id="forEach-touchId" type="variable" filter="number"></custom-box>
		</grid-box>
		<button id="forEach-confirm" name="confirm">Confirm</button>
		<button id="forEach-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
