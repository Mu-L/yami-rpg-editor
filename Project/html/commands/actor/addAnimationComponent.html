<window-frame id="addAnimationComponent">
	<title-bar>Add Animation Component<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text
			><custom-box id="addAnimationComponent-actor" type="actor"></custom-box>
			<text>Animation</text
			><custom-box
				id="addAnimationComponent-animationId"
				type="file"
				filter="animation"
			></custom-box>
			<text>Motion</text><select-box id="addAnimationComponent-motion"></select-box>
			<text>Rotatable</text><select-box id="addAnimationComponent-rotatable"></select-box>
			<text>Sync Angle</text><select-box id="addAnimationComponent-syncAngle"></select-box>
			<text>Priority</text
			><number-box id="addAnimationComponent-priority" min="-100" max="100"></number-box>
			<text>Offset Y</text
			><number-box
				id="addAnimationComponent-offsetY"
				min="-100"
				max="100"
				unit="px"
			></number-box>
		</grid-box>
		<button id="addAnimationComponent-confirm" name="confirm">Confirm</button>
		<button id="addAnimationComponent-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
