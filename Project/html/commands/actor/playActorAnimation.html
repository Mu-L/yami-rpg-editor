<window-frame id="playActorAnimation">
	<title-bar>Play Actor Animation<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text><custom-box id="playActorAnimation-actor" type="actor"></custom-box>
			<text>Motion</text
			><custom-box id="playActorAnimation-motion" type="enum-string"></custom-box>
			<text>Speed</text
			><number-var
				id="playActorAnimation-speed"
				min="0.1"
				max="10"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Wait</text><select-box id="playActorAnimation-wait" name="wait"></select-box>
		</grid-box>
		<button id="playActorAnimation-confirm" name="confirm">Confirm</button>
		<button id="playActorAnimation-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
