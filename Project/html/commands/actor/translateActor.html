<window-frame id="translateActor">
	<title-bar>Translate Actor<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text><custom-box id="translateActor-actor" type="actor"></custom-box>
			<text>Angle</text><custom-box id="translateActor-angle" type="angle"></custom-box>
			<text>Distance</text
			><number-var
				id="translateActor-distance"
				min="0"
				max="512"
				decimals="4"
				unit="tile"
			></number-var>
			<text>Easing</text><select-box id="translateActor-easingId" name="easing"></select-box>
			<text>Duration</text
			><number-var
				id="translateActor-duration"
				name="duration"
				min="0"
				max="3600000"
				unit="ms"
			></number-var>
			<text>Wait</text><select-box id="translateActor-wait" name="wait"></select-box>
		</grid-box>
		<button id="translateActor-confirm" name="confirm">Confirm</button>
		<button id="translateActor-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
