<window-frame id="setAnimationComponent">
	<title-bar>Set Animation Component<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text
			><custom-box id="setAnimationComponent-actor" type="actor"></custom-box>
			<text>Animation</text
			><custom-box
				id="setAnimationComponent-animationId"
				type="file"
				filter="animation"
			></custom-box>
			<text>Motion</text><select-box id="setAnimationComponent-motion"></select-box>
			<text>Operation</text><select-box id="setAnimationComponent-operation"></select-box>
			<text>Angle</text
			><custom-box id="setAnimationComponent-angle" type="angle"></custom-box>
			<text>Scale</text
			><number-var
				id="setAnimationComponent-scale"
				min="0"
				max="10"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Speed</text
			><number-var
				id="setAnimationComponent-speed"
				min="0"
				max="10"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Opacity</text
			><number-var
				id="setAnimationComponent-opacity"
				min="0"
				max="1"
				step="0.05"
				decimals="4"
			></number-var>
			<text>Priority</text
			><number-box id="setAnimationComponent-priority" min="-100" max="100"></number-box>
			<text>Offset Y</text
			><number-box
				id="setAnimationComponent-offsetY"
				min="-100"
				max="100"
				unit="px"
			></number-box>
			<text>Sprite Name</text><select-box id="setAnimationComponent-spriteId"></select-box>
			<text>Image</text
			><custom-box id="setAnimationComponent-image" type="file" filter="image"></custom-box>
			<text>Play Motion</text><select-box id="setAnimationComponent-playMotion"></select-box>
			<text>Wait</text><select-box id="setAnimationComponent-wait" name="wait"></select-box>
		</grid-box>
		<button id="setAnimationComponent-confirm" name="confirm">Confirm</button>
		<button id="setAnimationComponent-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
