<window-frame id="removeAnimationComponent">
	<title-bar>Remove Animation Component<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text
			><custom-box id="removeAnimationComponent-actor" type="actor"></custom-box>
			<text>Animation</text
			><custom-box
				id="removeAnimationComponent-animationId"
				type="file"
				filter="animation"
			></custom-box>
			<text>Motion</text><select-box id="removeAnimationComponent-motion"></select-box>
		</grid-box>
		<button id="removeAnimationComponent-confirm" name="confirm">Confirm</button>
		<button id="removeAnimationComponent-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
