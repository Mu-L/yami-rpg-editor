<window-frame id="renderOutline">
	<title-bar>Render Outline<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Operation</text><select-box id="renderOutline-operation"></select-box>
			<text>Actor</text><custom-box id="renderOutline-actor" type="actor"></custom-box>
			<text>Color</text><color-box id="renderOutline-color"></color-box>
		</grid-box>
		<button id="renderOutline-confirm" name="confirm">Confirm</button>
		<button id="renderOutline-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
