<window-frame id="changeActorMotion">
	<title-bar>Change Actor Motion<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text><custom-box id="changeActorMotion-actor" type="actor"></custom-box>
			<text>Type</text><select-box id="changeActorMotion-type"></select-box>
			<text>Motion</text
			><custom-box id="changeActorMotion-motion" type="enum-string"></custom-box>
		</grid-box>
		<button id="changeActorMotion-confirm" name="confirm">Confirm</button>
		<button id="changeActorMotion-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
