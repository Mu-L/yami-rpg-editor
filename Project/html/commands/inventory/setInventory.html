<window-frame id="setInventory">
	<title-bar>Set Inventory<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text><custom-box id="setInventory-actor" type="actor"></custom-box>
			<text>Operation</text><select-box id="setInventory-operation"></select-box>
			<text>Money</text
			><number-var id="setInventory-money" min="1" max="100000000"></number-var>
			<text>Item</text
			><file-var id="setInventory-itemId" type="file" filter="item"></file-var>
			<text>Quantity</text
			><number-var id="setInventory-quantity" min="1" max="10000"></number-var>
			<text>Equipment</text
			><file-var id="setInventory-equipmentId" type="file" filter="equipment"></file-var>
			<text>Equipment</text
			><custom-box id="setInventory-equipment" type="equipment"></custom-box>
			<text>Order A</text
			><number-var id="setInventory-order1" min="0" max="10000"></number-var>
			<text>Order B</text
			><number-var id="setInventory-order2" min="0" max="10000"></number-var>
			<text>Global Actor</text
			><custom-box id="setInventory-refActor" type="actor"></custom-box>
		</grid-box>
		<button id="setInventory-confirm" name="confirm">Confirm</button>
		<button id="setInventory-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
