<window-frame id="setShortcut">
	<title-bar>Set Shortcut<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text><custom-box id="setShortcut-actor" type="actor"></custom-box>
			<text>Operation</text><select-box id="setShortcut-operation"></select-box>
			<text>Shortcut Key</text><select-var id="setShortcut-key"></select-var>
			<text>Shortcut Key 2</text><select-var id="setShortcut-key2"></select-var>
			<text>Item</text><file-var id="setShortcut-itemId" type="file" filter="item"></file-var>
			<text>Skill</text
			><file-var id="setShortcut-skillId" type="file" filter="skill"></file-var>
		</grid-box>
		<button id="setShortcut-confirm" name="confirm">Confirm</button>
		<button id="setShortcut-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
