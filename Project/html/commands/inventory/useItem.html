<window-frame id="useItem">
	<title-bar>Use Item<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text><custom-box id="useItem-actor" type="actor"></custom-box>
			<text>Mode</text><select-box id="useItem-mode"></select-box> <text>Shortcut Key</text
			><select-box id="useItem-key"></select-box> <text>Item</text
			><custom-box id="useItem-itemId" type="file" filter="item"></custom-box>
			<text>Item</text><custom-box id="useItem-item" type="item"></custom-box>
			<text>Wait</text><select-box id="useItem-wait" name="wait"></select-box>
		</grid-box>
		<button id="useItem-confirm" name="confirm">Confirm</button>
		<button id="useItem-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
