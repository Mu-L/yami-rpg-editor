<window-frame id="createObject">
	<title-bar>Create Object<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Object</text
			><custom-box id="createObject-presetId" type="preset-object" filter="any"></custom-box>
			<text>Position</text
			><custom-box id="createObject-position" type="position"></custom-box>
		</grid-box>
		<button id="createObject-confirm" name="confirm">Confirm</button>
		<button id="createObject-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
