<window-frame id="playAnimation">
	<title-bar>Play Animation<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Mode</text><select-box id="playAnimation-mode"></select-box> <text>Position</text
			><custom-box id="playAnimation-position" type="position"></custom-box> <text>Actor</text
			><custom-box id="playAnimation-actor" type="actor"></custom-box> <text>Animation</text
			><custom-box id="playAnimation-animationId" type="file" filter="animation"></custom-box>
			<text>Motion</text><select-box id="playAnimation-motion"></select-box>
			<text>Rotatable</text><select-box id="playAnimation-rotatable"></select-box>
			<text>Priority</text
			><number-box id="playAnimation-priority" min="-100" max="100"></number-box>
			<text>Offset Y</text
			><number-var
				id="playAnimation-offsetY"
				min="-1000000000"
				max="1000000000"
				unit="px"
			></number-var>
			<text>Angle</text
			><number-var
				id="playAnimation-angle"
				min="-360"
				max="360"
				decimals="4"
				unit="deg"
			></number-var>
			<text>Speed</text
			><number-var
				id="playAnimation-speed"
				min="0.1"
				max="10"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Wait</text><select-box id="playAnimation-wait" name="wait"></select-box>
		</grid-box>
		<button id="playAnimation-confirm" name="confirm">Confirm</button>
		<button id="playAnimation-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
