<window-frame id="setObjectAnimation">
	<title-bar>Set Object Animation<close></close></title-bar>
	<content-frame>
		<grid-box id="setObjectAnimation-grid-box">
			<text>Sort</text><select-box id="setObjectAnimation-sort"></select-box>
			<text>Actor</text><custom-box id="setObjectAnimation-actor" type="actor"></custom-box>
			<text>Trigger</text
			><custom-box id="setObjectAnimation-trigger" type="trigger"></custom-box>
			<text>Animation</text
			><custom-box id="setObjectAnimation-animation" type="object"></custom-box>
			<text>Operation</text><select-box id="setObjectAnimation-operation"></select-box>
			<text>Tint - Red</text
			><number-box id="setObjectAnimation-tint-0" min="-255" max="255" step="5"></number-box>
			<text>Tint - Green</text
			><number-box id="setObjectAnimation-tint-1" min="-255" max="255" step="5"></number-box>
			<text>Tint - Blue</text
			><number-box id="setObjectAnimation-tint-2" min="-255" max="255" step="5"></number-box>
			<text>Tint - Grayscale</text
			><number-box id="setObjectAnimation-tint-3" min="0" max="255" step="5"></number-box>
			<text>Opacity</text
			><number-var
				id="setObjectAnimation-opacity"
				min="0"
				max="1"
				step="0.1"
				decimals="4"
			></number-var>
			<text>OffsetY</text
			><number-var
				id="setObjectAnimation-offsetY"
				min="-10000"
				max="10000"
				step="1"
				decimals="4"
			></number-var>
			<text>Rotation</text
			><number-var
				id="setObjectAnimation-rotation"
				min="-10000"
				max="10000"
				step="1"
				decimals="4"
			></number-var>
			<text>Easing</text
			><select-box id="setObjectAnimation-easingId" name="easing"></select-box>
			<text>Duration</text
			><number-box
				id="setObjectAnimation-duration"
				name="duration"
				min="0"
				max="3600000"
				unit="ms"
			></number-box>
			<text>Wait</text><select-box id="setObjectAnimation-wait" name="wait"></select-box>
		</grid-box>
		<button id="setObjectAnimation-confirm" name="confirm">Confirm</button>
		<button id="setObjectAnimation-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
