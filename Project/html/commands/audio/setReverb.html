<window-frame id="setReverb">
	<title-bar>Set Reverb<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="setReverb-type"></select-box> <text>Dry</text
			><number-var id="setReverb-dry" min="0" max="1" step="0.1" decimals="4"></number-var>
			<text>Wet</text
			><number-var id="setReverb-wet" min="0" max="1" step="0.1" decimals="4"></number-var>
			<text>Easing</text><select-box id="setReverb-easingId" name="easing"></select-box>
			<text>Duration</text
			><number-box
				id="setReverb-duration"
				name="duration"
				min="0"
				max="3600000"
				unit="ms"
			></number-box>
			<text>Wait</text><select-box id="setReverb-wait" name="wait"></select-box>
		</grid-box>
		<button id="setReverb-confirm" name="confirm">Confirm</button>
		<button id="setReverb-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
