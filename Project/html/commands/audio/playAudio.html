<window-frame id="playAudio">
	<title-bar>Play Audio<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="playAudio-type"></select-box> <text>Audio</text
			><custom-box id="playAudio-audio" type="file" filter="audio"></custom-box>
			<text>Volume</text
			><number-box id="playAudio-volume" min="0" max="1" step="0.1" decimals="4"></number-box>
			<text>Sound Location</text
			><custom-box id="playAudio-location" type="position"></custom-box>
		</grid-box>
		<button id="playAudio-confirm" name="confirm">Confirm</button>
		<button id="playAudio-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
