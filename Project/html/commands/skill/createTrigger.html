<window-frame id="createTrigger">
	<title-bar>Create Trigger<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Trigger</text
			><file-var id="createTrigger-triggerId" type="file" filter="trigger"></file-var>
			<text>Caster</text><custom-box id="createTrigger-caster" type="actor"></custom-box>
			<text>Origin</text><custom-box id="createTrigger-origin" type="position"></custom-box>
			<text>Angle</text><custom-box id="createTrigger-angle" type="angle"></custom-box>
			<text>Distance</text
			><number-var
				id="createTrigger-distance"
				min="-512"
				max="512"
				decimals="4"
				unit="tile"
			></number-var>
			<text>Scale</text
			><number-var
				id="createTrigger-scale"
				min="0.1"
				max="10"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Global Speed</text
			><number-var
				id="createTrigger-timeScale"
				min="0.1"
				max="10"
				step="0.1"
				decimals="4"
			></number-var>
		</grid-box>
		<button id="createTrigger-confirm" name="confirm">Confirm</button>
		<button id="createTrigger-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
