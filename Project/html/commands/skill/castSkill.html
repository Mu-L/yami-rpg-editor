<window-frame id="castSkill">
	<title-bar>Cast Skill<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Actor</text><custom-box id="castSkill-actor" type="actor"></custom-box>
			<text>Mode</text><select-box id="castSkill-mode"></select-box> <text>Shortcut Key</text
			><select-box id="castSkill-key"></select-box> <text>Shortcut Key</text
			><string-var id="castSkill-keyVar"></string-var> <text>Skill</text
			><custom-box id="castSkill-skillId" type="file" filter="skill"></custom-box>
			<text>Skill</text><custom-box id="castSkill-skill" type="skill"></custom-box>
			<text>Wait</text><select-box id="castSkill-wait" name="wait"></select-box>
		</grid-box>
		<button id="castSkill-confirm" name="confirm">Confirm</button>
		<button id="castSkill-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
