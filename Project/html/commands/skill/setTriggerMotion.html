<window-frame id="setTriggerMotion">
	<title-bar>Set Trigger Motion<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Trigger</text
			><custom-box id="setTriggerMotion-trigger" type="trigger"></custom-box>
			<text>Motion</text
			><custom-box id="setTriggerMotion-motion" type="enum-string"></custom-box>
		</grid-box>
		<button id="setTriggerMotion-confirm" name="confirm">Confirm</button>
		<button id="setTriggerMotion-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
