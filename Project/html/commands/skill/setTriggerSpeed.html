<window-frame id="setTriggerSpeed">
	<title-bar>Set Trigger Speed<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Trigger</text
			><custom-box id="setTriggerSpeed-trigger" type="trigger"></custom-box> <text>Speed</text
			><number-var
				id="setTriggerSpeed-speed"
				min="0"
				max="512"
				decimals="4"
				unit="t/s"
			></number-var>
		</grid-box>
		<button id="setTriggerSpeed-confirm" name="confirm">Confirm</button>
		<button id="setTriggerSpeed-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
