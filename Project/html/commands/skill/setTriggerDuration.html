<window-frame id="setTriggerDuration">
	<title-bar>Set Trigger Duration<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Trigger</text
			><custom-box id="setTriggerDuration-trigger" type="trigger"></custom-box>
			<text>Operation</text><select-box id="setTriggerDuration-operation"></select-box>
			<text>Duration</text
			><number-var
				id="setTriggerDuration-duration"
				min="0"
				max="3600000"
				unit="ms"
			></number-var>
		</grid-box>
		<button id="setTriggerDuration-confirm" name="confirm">Confirm</button>
		<button id="setTriggerDuration-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
