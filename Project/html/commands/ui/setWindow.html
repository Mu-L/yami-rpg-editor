<window-frame id="setWindow">
	<title-bar>Set Window<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Element</text><custom-box id="setWindow-element" type="element"></custom-box>
			<text>Properties</text><param-list id="setWindow-properties"></param-list>
		</grid-box>
		<button id="setWindow-confirm" name="confirm">Confirm</button>
		<button id="setWindow-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
