<window-frame id="controlButton">
	<title-bar>Control Button<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Operation</text><select-box id="controlButton-operation"></select-box>
			<text>Element</text><custom-box id="controlButton-element" type="element"></custom-box>
		</grid-box>
		<button id="controlButton-confirm" name="confirm">Confirm</button>
		<button id="controlButton-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
