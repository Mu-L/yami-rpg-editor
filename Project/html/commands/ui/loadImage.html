<window-frame id="loadImage">
	<title-bar>Load Image<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Element</text><custom-box id="loadImage-element" type="element"></custom-box>
			<text>Type</text><select-box id="loadImage-type"></select-box> <text>Actor</text
			><custom-box id="loadImage-actor" type="actor"></custom-box> <text>Skill</text
			><custom-box id="loadImage-skill" type="skill"></custom-box> <text>State</text
			><custom-box id="loadImage-state" type="state"></custom-box> <text>Equipment</text
			><custom-box id="loadImage-equipment" type="equipment"></custom-box> <text>Item</text
			><custom-box id="loadImage-item" type="item"></custom-box> <text>Shortcut Key</text
			><select-var id="loadImage-key"></select-var> <text>Base64 Coding</text
			><custom-box id="loadImage-variable" type="variable" filter="string"></custom-box>
		</grid-box>
		<button id="loadImage-confirm" name="confirm">Confirm</button>
		<button id="loadImage-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
