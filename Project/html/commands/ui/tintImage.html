<window-frame id="tintImage">
	<title-bar>Tint Image<close></close></title-bar>
	<content-frame>
		<grid-box id="tintImage-grid-box">
			<text>Element</text><custom-box id="tintImage-element" type="element"></custom-box>
			<text>Mode</text><select-box id="tintImage-mode"></select-box> <text>Tint - Red</text
			><number-box id="tintImage-tint-0" min="-255" max="255" step="5"></number-box>
			<text>Tint - Green</text
			><number-box id="tintImage-tint-1" min="-255" max="255" step="5"></number-box>
			<text>Tint - Blue</text
			><number-box id="tintImage-tint-2" min="-255" max="255" step="5"></number-box>
			<text>Tint - Grayscale</text
			><number-box id="tintImage-tint-3" min="0" max="255" step="5"></number-box>
			<text>Easing</text><select-box id="tintImage-easingId" name="easing"></select-box>
			<text>Duration</text
			><number-box
				id="tintImage-duration"
				name="duration"
				min="0"
				max="3600000"
				unit="ms"
			></number-box>
			<text>Wait</text><select-box id="tintImage-wait" name="wait"></select-box>
		</grid-box>
		<filter-box id="tintImage-filter" width="96" height="208"></filter-box>
		<button id="tintImage-confirm" name="confirm">Confirm</button>
		<button id="tintImage-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
