<window-frame id="setButton">
	<title-bar>Set Button<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Element</text><custom-box id="setButton-element" type="element"></custom-box>
			<text>Properties</text><param-list id="setButton-properties"></param-list>
		</grid-box>
		<button id="setButton-confirm" name="confirm">Confirm</button>
		<button id="setButton-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
