<window-frame id="nestElement">
	<title-bar>Nest Element<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Parent Element</text
			><custom-box id="nestElement-parent" type="element"></custom-box>
			<text>Child Element</text
			><custom-box id="nestElement-child" type="element"></custom-box>
		</grid-box>
		<button id="nestElement-confirm" name="confirm">Confirm</button>
		<button id="nestElement-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
