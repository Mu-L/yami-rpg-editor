<window-frame id="setAnimation">
	<title-bar>Set Animation<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Element</text><custom-box id="setAnimation-element" type="element"></custom-box>
			<text>Properties</text><param-list id="setAnimation-properties"></param-list>
		</grid-box>
		<button id="setAnimation-confirm" name="confirm">Confirm</button>
		<button id="setAnimation-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
