<window-frame id="setFocus">
	<title-bar>Set Focus<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Operation</text><select-box id="setFocus-operation"></select-box>
			<text>Element</text><custom-box id="setFocus-element" type="element"></custom-box>
			<text>Mode</text><select-box id="setFocus-mode"></select-box> <text>Cancelable</text
			><check-box id="setFocus-cancelable" class="standard large"></check-box>
		</grid-box>
		<button id="setFocus-confirm" name="confirm">Confirm</button>
		<button id="setFocus-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
