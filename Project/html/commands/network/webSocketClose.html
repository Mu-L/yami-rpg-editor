<window-frame id="webSocketClose">
	<title-bar>webSocketClose<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>ID</text><string-var id="webSocketClose-id"></string-var> <text>Code</text
			><number-box id="webSocketClose-code" min="1000" max="4999"></number-box>
			<text>Reason</text><string-var id="webSocketClose-reason"></string-var>
		</grid-box>
		<button id="webSocketClose-confirm" name="confirm">Confirm</button>
		<button id="webSocketClose-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
