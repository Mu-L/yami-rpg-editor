<window-frame id="requestURL">
	<title-bar>requestURL<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>URL</text><string-var id="requestURL-url"></string-var> <text>Header</text
			><param-list id="requestURL-header"></param-list> <text>Method</text
			><select-box id="requestURL-method"></select-box> <text>Data</text
			><param-list id="requestURL-data"></param-list> <text>CallBack</text
			><custom-box id="requestURL-callback" type="file" filter="event"></custom-box>
		</grid-box>
		<button id="requestURL-confirm" name="confirm">Confirm</button>
		<button id="requestURL-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
