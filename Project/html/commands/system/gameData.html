<window-frame id="gameData">
	<title-bar>Game Data<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Operation</text><select-box id="gameData-operation"></select-box>
			<text>Index</text><number-var id="gameData-index" min="0" max="32"></number-var>
			<text>Variables</text><text-box id="gameData-variables"></text-box>
		</grid-box>
		<button id="gameData-confirm" name="confirm">Confirm</button>
		<button id="gameData-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
