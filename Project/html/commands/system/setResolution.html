<window-frame id="setResolution">
	<title-bar>Set Resolution<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Width</text
			><number-var id="setResolution-width" min="240" max="7680" unit="px"></number-var>
			<text>Height</text
			><number-var id="setResolution-height" min="240" max="7680" unit="px"></number-var>
			<text>Scene Scale</text
			><number-var id="setResolution-sceneScale" min="0.5" max="4" decimals="10"></number-var>
			<text>UI Scale</text
			><number-var id="setResolution-uiScale" min="0.5" max="4" decimals="10"></number-var>
		</grid-box>
		<button id="setResolution-confirm" name="confirm">Confirm</button>
		<button id="setResolution-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
