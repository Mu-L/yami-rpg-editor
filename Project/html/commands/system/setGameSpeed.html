<window-frame id="setGameSpeed">
	<title-bar>Set Game Speed<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Speed</text
			><number-var
				id="setGameSpeed-speed"
				min="0"
				max="10"
				step="0.1"
				decimals="4"
			></number-var>
			<text>Easing</text><select-box id="setGameSpeed-easingId" name="easing"></select-box>
			<text>Duration</text
			><number-var
				id="setGameSpeed-duration"
				name="duration"
				min="0"
				max="3600000"
				unit="ms"
			></number-var>
			<text>Wait</text><select-box id="setGameSpeed-wait" name="wait"></select-box>
		</grid-box>
		<button id="setGameSpeed-confirm" name="confirm">Confirm</button>
		<button id="setGameSpeed-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
