<window-frame id="commandLine">
	<title-bar>Command Line<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Type</text><select-box id="commandLine-type"></select-box> <text>Key</text
			><string-var id="commandLine-key"></string-var> <text>Value</text
			><string-var id="commandLine-value"></string-var> <text>Variable</text
			><custom-box id="commandLine-variable" type="variable" filter="object"></custom-box>
		</grid-box>
		<button id="commandLine-confirm" name="confirm">Confirm</button>
		<button id="commandLine-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
