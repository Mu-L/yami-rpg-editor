<window-frame id="simulateKey">
	<title-bar>Simulate Key<close></close></title-bar>
	<content-frame>
		<grid-box>
			<text>Operation</text><select-box id="simulateKey-operation"></select-box>
			<text>Key Code</text><keyboard-box id="simulateKey-keycode"></keyboard-box>
		</grid-box>
		<button id="simulateKey-confirm" name="confirm">Confirm</button>
		<button id="simulateKey-cancel" name="cancel">Cancel</button>
	</content-frame>
</window-frame>
